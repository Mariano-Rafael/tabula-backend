spring.config.import=optional:file:./.env[.properties]
spring.application.name=tabula-backend

# Identity: activate the identity profile to configure MySQL from environment variables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:Administrador}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.enabled=false

# MYSQL
spring.profiles.active=identity

# MONGO
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:tabula}

ibm.watson.api-key=${IBM_API_KEY:}
